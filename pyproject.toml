[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mon-verify"
version = "0.1.0"
description = "Auditable verification of MU-Varna Ministry bibliometric indicators"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Medical University - Varna"}]
dependencies = [
  "pandas>=2.2",
  "openpyxl>=3.1",
  "requests>=2.32",
  "typer>=0.12",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "tenacity>=8.2",
  "rapidfuzz>=3.9",
  "streamlit>=1.38",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]

[project.scripts]
monverify = "monverify.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/monverify"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
